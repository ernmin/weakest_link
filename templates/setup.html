{% block content %}
<div class="game-container">
        <header>
            
        </header>

        <section class="setup-panel">
            <h2>Player Setup</h2>
            <form action="{{ url_for('game') }}" method="POST">
                <div class="input-group">
                    <label for="player-count">Number of Players (2-10)</label>
                    <input type="number" name="num_players" id="player-count" min="2" max="10" value="3">
                </div>

                <div class="player-names">
                    <h3>Player Names</h3>
                    <div id="name-inputs">
                    </div>
                </div>

                <div class="input-group">
                    <label for="timer">Round Timer (minutes)</label>
                    <input type="number" name="game_duration" id="timer" value="3" min="2" max="10">
                </div>

                <div class="button-group">
                    <!-- <button class="btn-start">Start Game</button> -->
                    
                        <button type="submit" class="btn-start">Start Game</button>
                    
                    <button class="btn-secondary">Customize Questions</button>
                </div>
            </form>
        </section>
    </div>

<!-- {% endblock %} -->

{% endblock %}

{% block scripts %}
    <!-- This puts the script tag into the base.html 'scripts' block -->
    <script src="{{ url_for('static', filename='js/setup.js') }}"></script>
{% endblock %}
